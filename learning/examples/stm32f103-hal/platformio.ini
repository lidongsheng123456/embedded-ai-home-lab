[platformio]
default_envs = 01a_gpio_blink

; 全部案例共用同一块 Blue Pill 和 ST-Link，公共配置只写一次。
[env]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200

[env:01a_gpio_blink]
build_src_filter = -<*> +<lessons/01a_gpio_blink.c>

[env:01b_gpio_button]
build_src_filter = -<*> +<lessons/01b_gpio_button.c>

[env:02a_clock_hsi]
build_src_filter = -<*> +<lessons/02a_clock_hsi.c>

[env:02b_clock_hse_systick]
build_src_filter = -<*> +<lessons/02b_clock_hse_systick.c>
build_flags = -D HSE_VALUE=8000000

[env:03a_exti_button]
build_src_filter = -<*> +<lessons/03a_exti_button.c>

[env:03b_exti_debounce]
build_src_filter = -<*> +<lessons/03b_exti_debounce.c>

[env:04a_uart_print]
build_src_filter = -<*> +<lessons/04a_uart_print.c>

[env:04b_uart_command]
build_src_filter = -<*> +<lessons/04b_uart_command.c>

[env:04c_uart_oled_loopback]
build_src_filter = -<*> +<lessons/04c_uart_oled_loopback.c>

[env:05a_timer_interrupt]
build_src_filter = -<*> +<lessons/05a_timer_interrupt.c>

[env:05b_pwm_fade]
build_src_filter = -<*> +<lessons/05b_pwm_fade.c>

[env:05c_uart_servo]
build_src_filter = -<*> +<lessons/05c_uart_servo.c> +<lessons/05c_oled_status.c>

[env:06a_adc_potentiometer]
build_src_filter = -<*> +<lessons/06a_adc_potentiometer.c>

[env:06b_adc_light]
build_src_filter = -<*> +<lessons/06b_adc_light.c>

[env:07a_i2c_oled]
build_src_filter = -<*> +<lessons/07a_i2c_oled.c>

[env:07b_spi_74hc595]
build_src_filter = -<*> +<lessons/07b_spi_74hc595.c>

[env:07c_spi_ili9341]
build_src_filter = -<*> +<lessons/07c_spi_ili9341.c>

[env:08a_uart_dma]
build_src_filter = -<*> +<lessons/08a_uart_dma.c>

[env:08b_sleep_state_machine]
build_src_filter = -<*> +<lessons/08b_sleep_state_machine.c>
