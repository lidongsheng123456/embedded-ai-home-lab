[platformio]
default_envs = core_st7789_154

[common]
platform = espressif32@^6.10.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  adafruit/Adafruit SHT4x Library@1.0.5
  claws/BH1750@^1.3.0
  bodmer/TFT_eSPI@^2.5.43
  ncmreynolds/ld2410@^0.1.4
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D BOARD_HAS_PSRAM
  -D USER_SETUP_LOADED=1
  -D TFT_MOSI=11
  -D TFT_MISO=-1
  -D TFT_SCLK=12
  -D TFT_CS=10
  -D TFT_DC=14
  -D TFT_RST=15
  -D SPI_FREQUENCY=20000000
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D SMOOTH_FONT=1

[env]
extra_scripts = pre:scripts/build_web.py
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
; 用户现有泽杰N16R8：16MB Flash + 8MB OPI PSRAM。
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_src_filter = +<*> -<diagnostics/>

; 订单中的“1.54寸IPS 8针”大概率使用ST7789。到货后必须看背面丝印确认。
[env:core_st7789_154]
lib_deps = ${common.lib_deps}
build_flags =
  ${common.build_flags}
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=240
  -D TFT_RGB_ORDER=TFT_BGR
  -D HOMEGUARD_ENABLE_CAMERA=0

; 保留原项目的2.4寸ILI9341环境，已有这块屏时选它。
[env:core_ili9341_240x320]
lib_deps = ${common.lib_deps}
build_flags =
  ${common.build_flags}
  -D ILI9341_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D HOMEGUARD_ENABLE_CAMERA=0

; 第一次收到摄像头只运行本环境，不连接其他模块。
[env:camera_ov2640_check]
build_flags =
  ${common.build_flags}
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=240
  -D HOMEGUARD_ENABLE_CAMERA=1

build_src_filter =
  -<*>
  +<diagnostics/camera_ov2640_check.cpp>
  +<drivers/camera_module.cpp>

; 核心模块全部通过后，才使用这个带网页拍照功能的完整环境。
[env:full_st7789_camera]
lib_deps = ${common.lib_deps}
build_flags =
  ${common.build_flags}
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=240
  -D TFT_RGB_ORDER=TFT_BGR
  -D HOMEGUARD_ENABLE_CAMERA=1

; R1载板的MQ-2采用10kΩ/10kΩ分压，原始面包板环境仍保留10kΩ/20kΩ。
[env:carrier_r1_core_st7789]
extends = env:core_st7789_154
build_flags =
  ${env:core_st7789_154.build_flags}
  -D HOMEGUARD_CARRIER_R1=1

[env:carrier_r1_full_st7789_camera]
extends = env:full_st7789_camera
build_flags =
  ${env:full_st7789_camera.build_flags}
  -D HOMEGUARD_CARRIER_R1=1
