<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660"><title>四层学习板布局布线说明</title><rect width="1100" height="660" rx="16" fill="#fffaf1"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#283e39"><text x="36" y="54" font-size="30" font-weight="bold">PCB1：按电流回路读四层布线</text><text x="36" y="92" font-size="20" >参考板35×25mm；下图依据实际布局绘制，位置单位mm，不能当加工文件。</text><rect x="40" y="130" width="630" height="450" rx="4" fill="#e4eadb" stroke="#7c8d70" stroke-width="3"/><path d="M112.00 292.00 L112.00 250.82 L124.82 238.00 L296.03 238.00 L310.00 252.00 L310.00 292.00" fill="none" stroke="#cc5b45" stroke-width="9"/><path d="M166.00 292.00 L166.00 238.00" fill="none" stroke="#cc5b45" stroke-width="9"/><path d="M346.00 292.00 L382.00 292.00" fill="none" stroke="#cc5b45" stroke-width="5"/><path d="M382.00 292.00 L436.00 292.00" fill="none" stroke="#4b77ae" stroke-width="5"/><path d="M436.00 292.00 L469.05 292.25" fill="none" stroke="#cc5b45" stroke-width="5"/><path d="M202.00 292.00 L229.00 292.00" fill="none" stroke="#cc5b45" stroke-width="9"/><path d="M506.85 292.25 L535.00 292.25" fill="none" stroke="#cc5b45" stroke-width="9"/><circle cx="382" cy="292" r="6" fill="#4b77ae" stroke="#283e39"/><circle cx="382" cy="292" r="2" fill="#fffaf1"/><circle cx="436" cy="292" r="6" fill="#4b77ae" stroke="#283e39"/><circle cx="436" cy="292" r="2" fill="#fffaf1"/><circle cx="229.0" cy="292" r="6" fill="#527966" stroke="#283e39"/><circle cx="229.0" cy="292" r="2" fill="#fffaf1"/><circle cx="535.0" cy="292.252" r="6" fill="#527966" stroke="#283e39"/><circle cx="535.0" cy="292.252" r="2" fill="#fffaf1"/><circle cx="382" cy="328" r="6" fill="#527966" stroke="#283e39"/><circle cx="382" cy="328" r="2" fill="#fffaf1"/><circle cx="436" cy="328" r="6" fill="#527966" stroke="#283e39"/><circle cx="436" cy="328" r="2" fill="#fffaf1"/><rect x="104" y="280" width="16" height="24" fill="#d4ac55" stroke="#665431"/><rect x="104" y="325.71999999999997" width="16" height="24" fill="#d4ac55" stroke="#665431"/><rect x="158" y="280" width="16" height="24" fill="#d4ac55" stroke="#665431"/><rect x="194" y="280" width="16" height="24" fill="#d4ac55" stroke="#665431"/><rect x="302" y="280" width="16" height="24" fill="#d4ac55" stroke="#665431"/><rect x="338" y="280" width="16" height="24" fill="#d4ac55" stroke="#665431"/><rect x="461.048" y="280.252" width="16" height="24" fill="#d4ac55" stroke="#665431"/><rect x="498.848" y="280.252" width="16" height="24" fill="#d4ac55" stroke="#665431"/><text x="76" y="400" font-size="18" >J101</text><text x="148" y="364" font-size="18" >C101</text><text x="292" y="364" font-size="18" >R101</text><text x="472" y="364" font-size="18" >D101</text><text x="105" y="165" font-size="18" >顶层：电源0.50mm；绕开电容地焊盘</text><text x="105" y="500" font-size="18" >下方留给第5课：R102 / R103 / C102 / J102</text><text x="695" y="150" font-size="19" >① 设置四铜层，先规则后布线</text><text x="695" y="190" font-size="19" >② 顶层电源、底层一段LED节点</text><text x="695" y="230" font-size="19" >③ 两信号孔：LEARN_LED_A</text><text x="695" y="270" font-size="19" >④ 四地孔：GND，不能接信号孔</text><text x="695" y="310" font-size="19" >⑤ L2、L3分别铺实心GND</text><text x="695" y="350" font-size="19" >⑥ 重铺后检查地接通与异网避让</text><text x="695" y="410" font-size="19" >电源/地短线0.50mm；节点0.25mm</text><text x="695" y="450" font-size="19" >过孔：外径0.60 / 钻孔0.30mm</text><text x="695" y="490" font-size="19" >间距≥0.20mm；铜到边≥0.50mm</text><text x="695" y="530" font-size="19" >最后：保存→重开→重铺→DRC</text><text x="36" y="624" font-size="19" >LED节点绕底层仅为学习换层；正式高速线应减少不必要的过孔，换层邻近安排回流地孔。</text></g></svg>