<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660"><title>最小LED与分压扩展电路</title><rect width="1100" height="660" rx="16" fill="#fffaf1"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#283e39"><text x="36" y="54" font-size="30" font-weight="bold">四件基础电路：先理解谁接谁，再决定铜线在哪层</text><text x="36" y="92" font-size="20" >讲解图不是原生网表；工程内 Board1 / Schematic1 / P1 可点选真实元件。</text><text x="45" y="148" font-size="22" >J101 输入 3.3V</text><text x="430" y="148" font-size="22" >R101 2.2kΩ</text><text x="825" y="148" font-size="22" >D101 黄LED</text><path d="M110 210 H430 M530 210 H850 M884 210 H970 V350 H110 V260" fill="none" stroke="#527966" stroke-width="3"/><rect x="430" y="196" width="100" height="28" fill="#fffaf1" stroke="#283e39" stroke-width="3"/><path d="M850 190 L850 230 L884 210 Z M890 190 V230" fill="none" stroke="#283e39" stroke-width="3"/><path d="M860 182 L880 162 M880 162 L872 164 M880 162 L878 170 M875 190 L895 170 M895 170 L887 172 M895 170 L893 178" fill="none" stroke="#283e39" stroke-width="2"/><rect x="65" y="188" width="45" height="95" fill="none" stroke="#283e39" stroke-width="3"/><text x="72" y="214" font-size="17" >1</text><text x="72" y="266" font-size="17" >2</text><text x="162" y="194" font-size="18" >LEARN_3V3</text><text x="580" y="194" font-size="18" >LEARN_LED_A</text><text x="170" y="380" font-size="19" >GND：回到电源负端</text><path d="M295 210 V267 M277 267 H313 M277 279 H313 M295 279 V350" fill="none" stroke="#527966" stroke-width="3"/><text x="320" y="278" font-size="20" >C101 100nF</text><text x="320" y="309" font-size="18" >并联旁路，不是串联降压</text><text x="824" y="254" font-size="18" >1=A</text><text x="900" y="254" font-size="18" >2=K</text><circle cx="295" cy="210" r="5" fill="#527966"/><circle cx="295" cy="350" r="5" fill="#527966"/><text x="36" y="425" font-size="22" >电流估算：(3.3V − 1.8～2.4V) / 2.2kΩ ≈ 0.41～0.68mA</text><path d="M36 450 H1060" fill="none" stroke="#b7c8be" stroke-width="1"/><text x="36" y="486" font-size="20" >第5课才增加分压：LEARN_3V3 → R102 10k → LEARN_HALF → R103 10k → GND</text><text x="36" y="524" font-size="20" >C102 100nF：LEARN_HALF ↔ GND；J102.1=LEARN_HALF，J102.2=GND</text><text x="36" y="562" font-size="20" >输出约1.65V，只供万用表测量；不能用这个分压器给模块供电。</text><text x="36" y="610" font-size="21" fill="#9d4b2d">基础4件/8脚/3网；扩展8件/16脚/4网。只接稳压3.3V，不接5V。</text></g></svg>