[platformio]
default_envs = step1_blink

[env]
platform = ststm32@^19.1.0
board = bluepill_f103c8
framework = arduino
upload_protocol = stlink
monitor_speed = 115200

[env:step1_blink]
build_flags = -D PET_STAGE=1

[env:step2_oled_face]
build_flags = -D PET_STAGE=2
lib_deps = olikraus/U8g2@^2.36.5

[env:step3_servo_head]
build_flags = -D PET_STAGE=3
lib_deps = olikraus/U8g2@^2.36.5

[env:step4_button_led]
build_flags = -D PET_STAGE=4
lib_deps = olikraus/U8g2@^2.36.5

[env:step5_bluetooth]
build_flags = -D PET_STAGE=5
lib_deps = olikraus/U8g2@^2.36.5

