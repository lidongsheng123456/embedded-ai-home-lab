[env:esp32-s3-devkitc-1]
platform = espressif32@^6.10.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
  sparkfun/SparkFun SCD4x Arduino Library@1.1.2
  adafruit/Adafruit SHT4x Library@1.0.5
  claws/BH1750@^1.3.0
  bodmer/TFT_eSPI@^2.5.43
  ncmreynolds/ld2410@^0.1.4

build_flags =
  -D USER_SETUP_LOADED=1
  -D ILI9341_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MOSI=11
  -D TFT_MISO=-1
  -D TFT_SCLK=12
  -D TFT_CS=10
  -D TFT_DC=14
  -D TFT_RST=15
  -D SPI_FREQUENCY=27000000
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D SMOOTH_FONT=1
